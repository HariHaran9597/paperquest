[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "paperquest"
version = "0.2.0"
description = "An evidence-backed interactive experiment for learning scaled dot-product attention"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
]

[project.scripts]
paperquest-author = "paperquest.authoring:run_local_review"

[project.optional-dependencies]
authoring = ["langgraph>=1.0,<2", "httpx>=0.27,<1"]
dev = ["httpx>=0.27,<1", "pytest>=8,<9", "langgraph>=1.0,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paperquest = ["web/*", "resources/data/papers/*.json", "resources/data/quests/*.json"]

[tool.ruff]
line-length = 100
target-version = "py311"

